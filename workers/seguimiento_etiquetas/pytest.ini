[pytest]
testpaths = tests test_label_config.py

# El worker se integró a este monorepo, no como distribución independiente.
# Dos grupos de artefactos del paquete original NO se copiaron a propósito, y
# las pruebas que los contratan se deseleccionan aquí en vez de borrarse, para
# que quede registro de qué cobertura se perdió y por qué:
#
# 1. `dashboard/` + `scripts/serve_dashboard.py`. INTEGRATION.md los declara
#    herramienta de referencia de desarrollo y prohíbe servirlos en producción:
#    el plano de consumo es el API autenticado del portal. No se despliegan, así
#    que su contrato de copy/rutas/headers no aplica.
# 2. `compose.yaml` y `deploy/systemd/` del paquete. Reemplazados por
#    docker-compose.yml / docker-compose.prod.yml de este repo, que definen los
#    mismos parámetros (TRACKING_MAX_ORDERS_PER_CYCLE, poll interval, runtime
#    privado) con la política de seguridad del portal.
#
# Al actualizar el worker desde un zip nuevo: correr la suite completa en el
# árbol original ANTES de vendorizar. Allí deben pasar las 85.
addopts =
    --deselect tests/test_distribution_contract.py::test_full_reconciliation_yields_shared_api_quota_to_live_tracking
    --deselect tests/test_distribution_contract.py::test_resumable_tracking_bootstrap_is_exposed_for_compose_and_systemd
    --deselect tests/test_distribution_contract.py::test_demo_payload_is_explicitly_synthetic
    --deselect tests/test_distribution_contract.py::test_clean_zip_contains_only_distributable_files
    --ignore=tests/test_dashboard_copy_contract.py
    --ignore=tests/test_dashboard_server.py
