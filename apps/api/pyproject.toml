[project]
name = "portal-clientes-api"
version = "0.1.0"
description = "Portal Clientes FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.10.4",
    "pydantic-settings>=2.7.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.0",
    "bcrypt>=4.2.0",
    "python-multipart>=0.0.20",
    "slowapi>=0.1.9",
    "structlog>=24.4.0",
    "redis>=5.2.1",
    "httpx>=0.28.1",
    "minio>=7.2.15",
    "sentry-sdk[fastapi]>=2.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.4.20240106",
    "types-passlib>=1.7.7.20240819",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"app/api/**/*.py" = ["B008"]
"app/core/deps.py" = ["B008"]
"app/models/analytics.py" = ["RUF012"]
"app/schemas/mantenimiento.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require a running PostgreSQL with analytics schema",
]
