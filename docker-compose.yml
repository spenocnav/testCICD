# Nombre de proyecto fijo: aísla contenedores, red y volúmenes de otras apps
# sin depender del nombre del directorio.
name: navi-portal-clientes

services:
  postgres:
    image: postgres:16-alpine
    container_name: portal-cliente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-portal_clientes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-portal_clientes_dev}
      POSTGRES_DB: ${POSTGRES_DB:-portal_clientes}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal_clientes} -d ${POSTGRES_DB:-portal_clientes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: portal-cliente-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: portal-cliente-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["full"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: portal-cliente-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-novedades}
      NAVIFAULT_MINIO_BUCKET: ${NAVIFAULT_MINIO_BUCKET:-navifault-manuals}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc mb --ignore-existing local/$$NAVIFAULT_MINIO_BUCKET
      "
    profiles: ["full"]

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
      REDIS_URL: ${REDIS_URL}
      REDIS_URL_LOCAL: ""
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["full"]

  novedad-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-novedad-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
      REDIS_URL: ${REDIS_URL}
      REDIS_URL_LOCAL: ""
    volumes:
      - ./apps/api:/app
    command: ["python", "scripts/run_novedad_outbox.py"]
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    profiles: ["full"]

  navifault-client-description-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-navifault-client-description-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
    volumes:
      - ./apps/api:/app
    command: ["python", "scripts/run_navifault_client_descriptions.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Vigila las novedades escaladas desde Navifault cuyo ciclo de falla sigue
  # abierto. Va en un proceso APARTE del `daily-sync-worker` a propósito: un
  # fallo de este sondeo no puede tumbar la cadena diaria, que es la que
  # alimenta los reportes. Los dos llaman al mismo servicio y comparten su
  # advisory lock, así que nunca corren a la vez.
  navifault-escalation-watch:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-navifault-escalation-watch
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
    volumes:
      - ./apps/api:/app
    command: ["python", "scripts/run_navifault_escalation_watch.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  auth-housekeeping:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-auth-housekeeping
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
    volumes:
      - ./apps/api:/app
    command: ["python", "scripts/run_refresh_token_purge.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Corrida diaria encadenada: a las 04:00 America/Bogota (09:00 UTC; los
  # contenedores corren en UTC) ejecuta EN ORDEN fuente maestra → ETL de
  # reportes → réplica CloudFleet. El paso de reportes encola en
  # `etl_trigger_request` y espera a `reportes-etl-worker`; los otros dos corren
  # en este proceso. Un paso que falla no detiene a los siguientes.
  # Sustituye al antiguo `cloudfleet-sync-worker`, cuyo loop por intervalo
  # disparaba a la hora de arranque del contenedor y sin coordinación.
  daily-sync-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-daily-sync-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_URL_LOCAL: ""
      DAILY_SYNC_ENABLED: "true"
      DAILY_SYNC_AT: "04:00"
      DAILY_SYNC_TIMEZONE: "America/Bogota"
    volumes:
      - ./apps/api:/app
    command: ["python", "scripts/run_daily_sync.py"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Worker sidecar de tracking CloudFleet. Su runtime es privado y no se monta
  # en el API ni en el navegador; el ingestor lo consume en solo lectura.
  seguimiento-etiquetas-worker:
    build:
      context: ./workers/seguimiento_etiquetas
      dockerfile: Dockerfile
    container_name: portal-cliente-seguimiento-etiquetas-worker
    restart: unless-stopped
    environment:
      CLOUDFLEET_API_KEY: ${CLOUDFLEET_API_KEY:-}
      CLOUDFLEET_BASE_URL: ${CLOUDFLEET_BASE_URL:-https://fleet.cloudfleet.com/api/v1/}
      TRACKING_RUNTIME_DIR: /runtime
      TRACKING_POLL_INTERVAL_SECONDS: ${TRACKING_POLL_INTERVAL_SECONDS:-300}
      TRACKING_MAX_ORDERS_PER_CYCLE: ${TRACKING_MAX_ORDERS_PER_CYCLE:-60}
      TRACKING_COVERAGE_SLA_SECONDS: ${TRACKING_COVERAGE_SLA_SECONDS:-1800}
    volumes:
      - tracking_runtime:/runtime
    # Sin `command`: el ENTRYPOINT de la imagen ya es
    # `python -u tracking_label_worker.py`. Docker anexa `command` como
    # argumentos del entrypoint, así que repetirlo aquí se lo pasa a argparse
    # como flags desconocidos y el worker no arranca.
    profiles: ["full"]

  tracking-ingest-worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-tracking-ingest-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_LOCAL: ""
      TRACKING_RUNTIME_DIR: /tracking-runtime
      TRACKING_INGEST_INTERVAL_SECONDS: ${TRACKING_INGEST_INTERVAL_SECONDS:-30}
    volumes:
      - ./apps/api:/app
      - tracking_runtime:/tracking-runtime:ro
    command: ["python", "scripts/ingest_cloudfleet_tracking.py", "--loop"]
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  # Worker del ETL de reportes (InformesRendimiento, subárbol de este repositorio).
  # Atiende disparos por `etl_trigger_request`: el botón del portal y el paso 2
  # de `daily-sync-worker`. Su schedule propio queda APAGADO
  # (ETL_SCHEDULE_ENABLED=false) a propósito: dispararía por intervalo desde el
  # arranque del contenedor, en paralelo a la cadena diaria y sin su orden.
  # Credenciales Geotab y DB URLs del ETL vienen de InformesRendimiento/.env;
  # acá solo se sobreescriben las URLs para apuntar al postgres del compose.
  reportes-etl-worker:
    build:
      context: ./InformesRendimiento
      dockerfile: Dockerfile
      target: development
    container_name: portal-cliente-reportes-etl-worker
    restart: unless-stopped
    env_file:
      - ./InformesRendimiento/.env
    environment:
      MASTER_DB_URL: ${DATABASE_URL}
      ANALYTICS_DB_URL: ${DATABASE_URL}
      ETL_SCHEDULE_ENABLED: "false"
      ETL_SCHEDULE_INTERVAL_SECONDS: "86400"
      ETL_TRIGGER_POLL_SECONDS: "15"
      # Vía rápida de FaultData para Navifault. Corre dentro del mismo worker cada 5 min (300s);
      # publica solo fact_fault_event.
      ETL_FAULTS_REALTIME_ENABLED: "true"
      ETL_FAULTS_INTERVAL_SECONDS: "300"
      ETL_STREAMING_DATASETS: "factor_carga"
      # Dominios apagados de punta a punta: sin Geotab, sin transform y sin load.
      # Reactivar uno acá lo devuelve al pipeline completo.
      ETL_DISABLED_DOMAINS: "ubicaciones,altimetria,consumo_def"
      ETL_STREAM_MAX_EXTRACTORS: "4"
      ETL_STREAM_QUEUE_SIZE: "8"
      ETL_DB_POOL_SIZE: "2"
      ETL_DB_MAX_OVERFLOW: "0"
    volumes:
      - ./InformesRendimiento:/etl
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    container_name: portal-cliente-web
    restart: unless-stopped
    environment:
      # Llama a la API a través del rewrite de Next.js (same-origin)
      NEXT_PUBLIC_API_URL: ""
      # Destino del rewrite: nombre del servicio API en Docker
      API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # Código fuente en vivo para HMR; node_modules y .next se preservan desde la imagen.
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
      - /app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy
    profiles: ["full"]

# Volúmenes con nombre explícito y único para no cruzarse con otras apps.
volumes:
  postgres_data:
    name: navi-portal-clientes_postgres_data
  redis_data:
    name: navi-portal-clientes_redis_data
  minio_data:
    name: navi-portal-clientes_minio_data
  tracking_runtime:
    name: navi-portal-clientes_tracking_runtime
